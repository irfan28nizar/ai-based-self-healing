services:
  service-a:
    build:
      context: ./services/service-a
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: service-a
      PORT: "8000"
    restart: unless-stopped

  service-b:
    build:
      context: ./services/service-b
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: service-b
      PORT: "8001"
    restart: unless-stopped
